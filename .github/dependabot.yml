version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # wrangler と @cloudflare/vite-plugin は内部の workerd の版をそろえる必要がある。
      # 片方だけ上げるとローカルのD1が開けなくなるので、必ずまとめて更新する
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      # Prettier は minor 更新でも整形結果が変わることがあるので、まとめず単独のPRで受け取り、再整形コミットを載せてからマージする
      minor-and-patch:
        exclude-patterns: ['prettier']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
